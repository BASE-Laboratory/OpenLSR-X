name: Bug Report
description: Report a bug, metric discrepancy, or configuration issue in OpenLSR-X
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: Clear description of what failed or produced unexpected scientific results.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps / Command to Reproduce
      description: Minimal CLI command, YAML snippet, or Python snippet.
      placeholder: |
        openlsrx fit -c configs/base/config.yaml
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: Environment (OS, Python, PyTorch, CUDA)
      placeholder: "Ubuntu 24.04, Python 3.11, PyTorch 2.5 (CUDA 12.4)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Traceback / Logs
      render: shell
