name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, Typecheck & Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies (CPU PyTorch)
        run: |
          uv venv --python 3.11
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          uv pip install -e ".[dev,docs]"

      - name: Ruff lint & format check
        run: |
          uv run --no-sync ruff check src tests scripts
          uv run --no-sync ruff format --check src tests scripts

      - name: Static type check (Mypy)
        run: |
          uv run --no-sync mypy src tests scripts

      - name: Build documentation strictly
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          uv run --no-sync mkdocs build --strict

      - name: Build wheel and sdist packages
        run: |
          uv build
          ls -lh dist/

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (CPU PyTorch)
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          uv pip install -e ".[dev]"

      - name: Run unit, analytical, CLI & config tests with coverage gate
        run: |
          uv run --no-sync pytest --cov=openlsrx --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage artifact (Python 3.11)
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  benchmark-smoke:
    name: End-to-End Benchmark & Paper Output Smoke
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11 & dependencies
        run: |
          uv python install 3.11
          uv venv --python 3.11
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          uv pip install -e "."

      - name: Run fast synthetic + rock benchmarks and generate LaTeX/figures
        run: |
          uv run --no-sync python scripts/benchmarks/porespy_study.py --fast --output-dir /tmp/bench/porespy
          uv run --no-sync python scripts/benchmarks/public_rock_xct.py --fast --output-dir /tmp/bench/rock --data-dir /tmp/bench/data
          uv run --no-sync python scripts/benchmarks/make_paper_outputs.py \
            --porespy-csv /tmp/bench/porespy/porespy_study_results.csv \
            --rock-csv /tmp/bench/rock/public_rock_results.csv \
            --example-volumes /tmp/bench/porespy/example_volumes \
            --out-dir /tmp/bench/paper_artifacts
          test -f /tmp/bench/paper_artifacts/tables/porespy_benchmark.tex
          test -f /tmp/bench/paper_artifacts/figures/orthogonal_sr_comparison.pdf
