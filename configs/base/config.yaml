# Base OpenLSR-X training configuration (runs out-of-the-box on synthetic PoreSpy 3D XCT)
seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  precision: 32-true
  max_epochs: 100
  check_val_every_n_epoch: 10
  log_every_n_steps: 10

model:
  learning_rate: 1.0e-4
  adaptive_size: 8
  accumulate_n_batches: 1
  super_res_factor: 2
  num_blocks: 10
  out_channels: 64
  norm_type: pixel
  output_activation: custom_sigmoid
  sigmoid_k: 1.0
  pixel_loss_type: mse
  use_adversarial_loss: true
  adversarial_weight: 1.0e-3
  pretrain_epochs: 5
  use_vgg_loss: false
  vgg_loss_weight: 0.006
  lr_scheduler_type: constant

data:
  class_path: openlsrx.data.SyntheticPoreSpyDataModule
  init_args:
    volume_size: 128
    feature_regime: high_feature
    noise_regime: low_noise
    representation: attenuation
    scale_factor: 2
    train_frac: 0.70
    val_frac: 0.15
    guard_slices_lr: 1
    train_axes: ["yz"]
    test_axis: perpendicular
    predict_axis: xy
    patch_size_lr: 32
    augment: true
    batch_size: 4
    eval_batch_size: 4
    num_workers: 0
    pin_memory: false
    seed: 42
    cache_dir: data/cache
