# Bentheimer Sandstone orthogonal prediction configuration
# Pass --ckpt_path path/to/bentsand.ckpt
seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  precision: 32-true

model:
  learning_rate: 5.0e-5
  adaptive_size: 8
  super_res_factor: 2
  num_blocks: 10
  sample_id: bentsand

data:
  class_path: openlsrx.data.PairedVolumeDataModule
  init_args:
    high_path: data/benchmarks/bentheimer_sandstone_hr.tif
    degrade_from_hr: true
    scale_factor: 2
    psf_sigma: 0.85
    degrade_noise_std: 0.025
    norm_mode: percentile
    lower_pct: 0.5
    upper_pct: 99.5
    predict_axis: xz
    predict_mode: orthogonal_3axis
    predict_fusion: confidence_fourier
    eval_batch_size: 4
    num_workers: 0
    seed: 42
