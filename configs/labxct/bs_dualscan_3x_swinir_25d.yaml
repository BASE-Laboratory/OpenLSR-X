# Bentheimer Sandstone Physical Dual-Scan 3x Super-Resolution (18 um -> 6 um, Zenodo 5542624)
# Prepare benchmark data via:
#   openlsrx download-benchmarks --datasets bentheimer_dualscan_core1 bentheimer_dualscan_core2 --size 75
# Uses native PixelShuffle(3) SwinIR-2.5D + split-isolated train-slab quantile radiometric calibration.
seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  precision: 16-mixed
  max_epochs: 300
  check_val_every_n_epoch: 10
  log_every_n_steps: 20

model:
  backbone: swinir
  context_slices: 3
  out_channels: 48
  num_blocks: 4
  swin_window_size: 8
  swin_num_heads: 4
  output_activation: clamp
  pixel_loss_type: l1
  learning_rate: 3.0e-4
  adaptive_size: 8
  accumulate_n_batches: 1
  super_res_factor: 3
  use_adversarial_loss: false
  use_vgg_loss: false
  conservation_loss_weight: 0.10
  conservation_psf_sigma: 1.0
  topology_loss_weight: 0.04
  gradient_loss_weight: 0.06
  ffl_loss_weight: 0.02
  sample_id: Bentheimer_DualScan_3x_SwinIR_25D

data:
  class_path: openlsrx.data.PairedVolumeDataModule
  init_args:
    low_path: data/benchmarks/bentheimer_dualscan_core1_lr.tif
    high_path: data/benchmarks/bentheimer_dualscan_core1_hr.tif
    degrade_from_hr: false
    scale_factor: 3
    context_slices: 3
    norm_mode: percentile
    lower_pct: 0.5
    upper_pct: 99.5
    cross_scan_calibration: quantile
    calibration_psf_sigma: 1.0
    train_frac: 0.65
    val_frac: 0.15
    guard_slices_lr: 1
    train_axes: ["yz", "xz", "xy"]
    test_axis: perpendicular
    predict_axis: xy
    patch_size_lr: 32
    augment: true
    batch_size: 4
    eval_batch_size: 4
    num_workers: 2
    pin_memory: true
    seed: 42
