# Indiana Limestone orthogonal prediction configuration
# Pass --ckpt_path path/to/indlime.ckpt
seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  precision: 32-true

model:
  learning_rate: 5.0e-5
  adaptive_size: 16
  super_res_factor: 2
  num_blocks: 12
  sample_id: indlime

data:
  class_path: openlsrx.data.PairedVolumeDataModule
  init_args:
    high_path: data/benchmarks/indiana_limestone_hr.tif
    degrade_from_hr: true
    scale_factor: 2
    predict_axis: xz
    eval_batch_size: 4
    num_workers: 0
    seed: 42
