# Indiana Limestone XCT configuration (bimodal microporous + vuggy carbonate)
# Prepare public benchmark data via: openlsrx download-benchmarks
# For Calum's rotated LabXCT stack, pass --data.init_args.rotation_deg 254.0
seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  precision: 16-mixed
  max_epochs: 500
  check_val_every_n_epoch: 25
  log_every_n_steps: 25

model:
  learning_rate: 5.0e-5
  adaptive_size: 8
  accumulate_n_batches: 1
  super_res_factor: 2
  num_blocks: 12
  pretrain_epochs: 10
  use_adversarial_loss: true
  use_vgg_loss: true
  vgg_loss_weight: 0.006
  sample_id: indlime

data:
  class_path: openlsrx.data.PairedVolumeDataModule
  init_args:
    high_path: data/benchmarks/indiana_limestone_hr.tif
    degrade_from_hr: true
    scale_factor: 2
    psf_sigma: 0.90
    degrade_noise_std: 0.030
    norm_mode: percentile
    lower_pct: 0.5
    upper_pct: 99.5
    rotation_deg: 0.0
    train_frac: 0.70
    val_frac: 0.15
    guard_slices_lr: 1
    train_axes: ["yz"]
    test_axis: perpendicular
    predict_axis: xz
    patch_size_lr: 32
    augment: true
    batch_size: 4
    eval_batch_size: 4
    num_workers: 0
    seed: 42