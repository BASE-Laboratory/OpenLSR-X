# Synthetic PoreSpy Study: High Noise + High Feature Frequency (2x SR)
seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  precision: 16-mixed
  max_epochs: 400
  check_val_every_n_epoch: 20
  log_every_n_steps: 20

model:
  learning_rate: 1.0e-4
  adaptive_size: 8
  accumulate_n_batches: 1
  super_res_factor: 2
  num_blocks: 16
  pretrain_epochs: 10
  use_adversarial_loss: true
  use_vgg_loss: true
  vgg_loss_weight: 0.006
  sample_id: ps_hn_hf

data:
  class_path: openlsrx.data.SyntheticPoreSpyDataModule
  init_args:
    volume_size: 256
    feature_regime: high_feature
    noise_regime: high_noise
    representation: attenuation
    scale_factor: 2
    train_frac: 0.70
    val_frac: 0.15
    guard_slices_lr: 1
    train_axes: ["yz"]
    test_axis: perpendicular
    predict_axis: xy
    patch_size_lr: 64
    augment: true
    batch_size: 4
    eval_batch_size: 4
    num_workers: 2
    pin_memory: true
    seed: 42
    cache_dir: data/cache
