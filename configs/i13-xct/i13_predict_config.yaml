# Diamond Light Source I13 Synchrotron XCT orthogonal prediction configuration
# Pass --ckpt_path path/to/zn13x.ckpt and --data.init_args.predict_path path/to/low_res_recon.nxs
seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  precision: 32-true

model:
  learning_rate: 1.0e-5
  adaptive_size: 8
  super_res_factor: 2
  num_blocks: 10
  sample_id: Zn13X

data:
  class_path: openlsrx.data.PairedVolumeDataModule
  init_args:
    predict_path: data/i13/low_res_recon.nxs
    h5_dataset_key: 4-TomopyRecon-tomo/data
    transpose_axes: [1, 2, 0]
    scale_factor: 2
    norm_mode: fixed
    low_vmin: -5.23e-4
    low_vmax: 1.11e-3
    low_z_range: [845, 1485]
    low_y_range: [1010, 1650]
    low_x_range: [858, 1498]
    predict_axis: xy
    predict_mode: orthogonal_3axis
    predict_fusion: confidence_fourier
    eval_batch_size: 2
    num_workers: 0
    seed: 42
