# Diamond Light Source I13 Synchrotron XCT legacy NeXus slicing configuration (Zn-13X)
# NOTE: Direct raw .nxs index slicing assumes nominal 2.000x objective magnification and exhibits ~1.3%
# edge scale drift across 1,280 HR px. For 7-DOF similarity-registered slabs (configs/i13-xct/certified_regions.yaml),
# stage via `openlsrx download-zn13x --pair 2x --raw-h5-dir <dir>` and use zn13x_2x_1625_to_08125.yaml.
seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  precision: 16-mixed
  max_epochs: 1000
  check_val_every_n_epoch: 20
  log_every_n_steps: 50

model:
  learning_rate: 1.0e-5
  adaptive_size: 8
  accumulate_n_batches: 1
  super_res_factor: 2
  num_blocks: 10
  pretrain_epochs: 10
  use_adversarial_loss: true
  use_vgg_loss: false
  sample_id: Zn13X

data:
  class_path: openlsrx.data.PairedVolumeDataModule
  init_args:
    low_path: data/i13/low_res_recon.nxs
    high_path: data/i13/high_res_recon.nxs
    h5_dataset_key: 4-TomopyRecon-tomo/data
    transpose_axes: [1, 2, 0]
    scale_factor: 2
    norm_mode: fixed
    low_vmin: -5.23e-4
    low_vmax: 1.11e-3
    high_vmin: -5.23e-4
    high_vmax: 1.11e-3
    low_z_range: [845, 1485]
    low_y_range: [1010, 1650]
    low_x_range: [858, 1498]
    high_z_range: [706, 1986]
    high_y_range: [763, 2043]
    high_x_range: [466, 1746]
    train_frac: 0.75
    val_frac: 0.125
    guard_slices_lr: 2
    train_axes: ["yz"]
    test_axis: perpendicular
    predict_axis: xy
    patch_size_lr: 64
    augment: true
    batch_size: 2
    eval_batch_size: 2
    num_workers: 2
    pin_memory: true
    seed: 42