# Diamond Light Source I13-2 Experimental 8x Pair: 2.5x (2.600 um) -> 20x (0.325 um)
# Prepare slabs via: openlsrx download-benchmarks --datasets zn13x_8x
seed_everything: 42

trainer:
  accelerator: auto
  devices: 1
  precision: 16-mixed
  max_epochs: 400
  check_val_every_n_epoch: 10
  log_every_n_steps: 20

model:
  learning_rate: 1.0e-4
  adaptive_size: 8
  accumulate_n_batches: 2
  super_res_factor: 8
  num_blocks: 12
  pretrain_epochs: 30
  use_adversarial_loss: true
  use_vgg_loss: true
  sample_id: Zn13X_8x_2600_to_0325

data:
  class_path: openlsrx.data.PairedVolumeDataModule
  init_args:
    low_path: data/benchmarks/zn13x_8x_lr.tif
    high_path: data/benchmarks/zn13x_8x_hr.tif
    scale_factor: 8
    # Default Zenodo 14245751 8-bit preview slabs use independent contrast windows;
    # set norm_mode: none + cross_scan_calibration: none for raw float32 --raw-h5-dir slabs.
    norm_mode: percentile
    cross_scan_calibration: quantile
    calibration_psf_sigma: 1.2
    train_frac: 0.70
    val_frac: 0.15
    guard_slices_lr: 1
    train_axes: ["yz"]
    test_axis: perpendicular
    predict_axis: xy
    patch_size_lr: 16
    augment: true
    batch_size: 2
    eval_batch_size: 2
    num_workers: 2
    pin_memory: true
    seed: 42
