seed_everything: 42

trainer:
  precision: "16-mixed"
  max_epochs: 2001
  devices: 1
  accelerator: "gpu"
  check_val_every_n_epoch: 200
  log_every_n_steps: 200

# ckpt_path: '/PATH/TO/CHECKPOINTS/FOR/RESUMING'

model:
  learning_rate: 0.0003
  adaptive_size: 40
  accumulate_n_batches: 1
  super_res_factor: 2
  use_vgg_loss: True
  vgg_loss_weight: 0.006
  vgg_layers: 18
  lr_scheduler_type: "CosineAnnealingWarmRestarts"

data:
  low_file: '/PATH/TO/LOW-RES_DATA/'
  high_file: '/PATH/TO/HIGH-RES_DATA/'
  dataset_size: 1000
  train_size: 0.8
  valid_size: 0.1
  test_size: 0.1
  batch_size: 1
  num_workers: 0
  pin_memory: True
  persistent_workers: False
